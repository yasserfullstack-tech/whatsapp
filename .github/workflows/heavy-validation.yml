name: Heavy Validation

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Heavy scenario to run on the dedicated QA load runner
        required: true
        type: choice
        options:
          - campaign-500k
          - webhook-100k
          - reporting-500k
          - soak
          - destructive-chaos

permissions:
  contents: read

concurrency:
  group: heavy-validation
  cancel-in-progress: false

jobs:
  campaign-500k:
    if: inputs.scenario == 'campaign-500k'
    runs-on: [self-hosted, linux, x64, qa-load]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - name: 500k recipients at 1000 MPS target
        run: bun run load:run -- --scenario=baseline-1000 --recipients=500000 --timeout-ms=3600000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-500k-results
          path: load-results/
          if-no-files-found: ignore
      - if: always()
        run: bun run load:infra:down || true

  webhook-100k:
    if: inputs.scenario == 'webhook-100k'
    runs-on: [self-hosted, linux, x64, qa-load]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - name: 100k signed webhook flood
        run: bun run load:webhooks -- --events=100000 --concurrency=400 --timeout-ms=900000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webhook-100k-results
          path: load-results/
          if-no-files-found: ignore
      - if: always()
        run: bun run load:infra:down || true

  reporting-500k:
    if: inputs.scenario == 'reporting-500k'
    runs-on: [self-hosted, linux, x64, qa-load]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: whatsapp_reporting
          POSTGRES_USER: whatsapp
          POSTGRES_PASSWORD: whatsapp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whatsapp -d whatsapp_reporting"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://whatsapp:whatsapp@localhost:5432/whatsapp_reporting
      REPORT_RECIPIENTS: "500000"
      REPORT_CAMPAIGNS: "10"
      REPORT_PHONE_NUMBERS: "3"
      REPORT_KEEP_DATA: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - name: 500k reporting benchmark
        run: bun run --filter @wa/load-test reporting
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporting-500k-results
          path: load-results/
          if-no-files-found: ignore

  soak:
    if: inputs.scenario == 'soak'
    runs-on: [self-hosted, linux, x64, qa-load]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - name: Repeated 100k campaign soak
        shell: bash
        run: |
          set -euo pipefail
          for iteration in 1 2 3 4 5 6; do
            echo "soak iteration ${iteration}/6"
            bun run load:run -- --scenario=baseline-1000 --recipients=100000 --timeout-ms=900000
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-results
          path: load-results/
          if-no-files-found: ignore
      - if: always()
        run: bun run load:infra:down || true

  destructive-chaos:
    if: inputs.scenario == 'destructive-chaos'
    runs-on: [self-hosted, linux, x64, qa-load]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - name: Isolated Redis worker Postgres and multi-worker chaos
        shell: bash
        run: |
          set -euo pipefail
          bun apps/load-test/src/chaos.ts --chaos=redis-restart --scenario=baseline-1000 --recipients=10000 --timeout-ms=600000
          bun apps/load-test/src/chaos.ts --chaos=worker-restart --scenario=baseline-1000 --recipients=10000 --timeout-ms=600000
          bun apps/load-test/src/chaos.ts --chaos=postgres-pressure --scenario=baseline-1000 --recipients=10000 --timeout-ms=600000
          bun apps/load-test/src/chaos.ts --chaos=multi-worker --scenario=baseline-1000 --recipients=10000 --extra-workers=2 --timeout-ms=600000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-results
          path: load-results/
          if-no-files-found: ignore
      - name: Cleanup isolated chaos infrastructure
        if: always()
        run: docker compose -f docker-compose.load-chaos.yml down -v --remove-orphans || true
