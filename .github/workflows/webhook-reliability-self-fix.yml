name: Apply webhook reliability review fixes

on:
  push:
    branches: [feat/webhook-reliability]
    paths:
      - .github/workflows/webhook-reliability-self-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Apply review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/worker/src/webhooks.ts")
          text = path.read_text()

          old_claim = '''async function claimWebhookEvent(db: Database, eventId: string) {
            const staleBefore = new Date(Date.now() - WEBHOOK_STALE_PROCESSING_MS);
            const [event] = await db
              .update(schema.webhookEvents)
              .set({
                processingAttempts: sql`${schema.webhookEvents.processingAttempts} + 1`,
                processingStatus: "processing",
                processingStartedAt: new Date(),
                lastProcessingError: null,
                nextRetryAt: null,
              })
              .where(and(
                eq(schema.webhookEvents.id, eventId),
                isNull(schema.webhookEvents.processedAt),
                isNull(schema.webhookEvents.deadLetteredAt),
                or(
                  sql`${schema.webhookEvents.processingStatus} <> 'processing'`,
                  isNull(schema.webhookEvents.processingStartedAt),
                  lt(schema.webhookEvents.processingStartedAt, staleBefore),
                ),
              ))'''
          new_claim = '''async function claimWebhookEvent(db: Database, eventId: string) {
            const [event] = await db
              .update(schema.webhookEvents)
              .set({
                processingAttempts: sql`${schema.webhookEvents.processingAttempts} + 1`,
                processingStatus: "processing",
                processingStartedAt: new Date(),
                lastProcessingError: null,
                nextRetryAt: null,
              })
              .where(and(
                eq(schema.webhookEvents.id, eventId),
                isNull(schema.webhookEvents.processedAt),
                isNull(schema.webhookEvents.deadLetteredAt),
                or(
                  sql`${schema.webhookEvents.processingStatus} <> 'processing'`,
                  isNull(schema.webhookEvents.processingStartedAt),
                ),
              ))'''

          old_metric = '''oldestUnprocessedAgeSeconds: sql<number>`COALESCE(
                  EXTRACT(EPOCH FROM (now() - MIN(${schema.webhookEvents.createdAt}))) FILTER (
                    WHERE ${schema.webhookEvents.processedAt} IS NULL
                      AND ${schema.webhookEvents.deadLetteredAt} IS NULL
                  ),
                  0
                )::double precision`,'''
          new_metric = '''oldestUnprocessedAgeSeconds: sql<number>`COALESCE(
                  EXTRACT(EPOCH FROM (
                    now() - (MIN(${schema.webhookEvents.createdAt}) FILTER (
                      WHERE ${schema.webhookEvents.processedAt} IS NULL
                        AND ${schema.webhookEvents.deadLetteredAt} IS NULL
                    ))
                  )),
                  0
                )::double precision`,'''

          old_reconcile = '''    if (reason === "stale_processing") {
                await db
                  .update(schema.webhookEvents)
                  .set({
                    processingStatus: "retry",
                    processingStartedAt: null,
                    lastProcessingError: "Reconciliation recovered a stale webhook processing claim",
                    nextRetryAt: now,
                  })
                  .where(and(
                    eq(schema.webhookEvents.id, event.id),
                    isNull(schema.webhookEvents.processedAt),
                    isNull(schema.webhookEvents.deadLetteredAt),
                  ));
              } else {
                const existing = await queue.getJob(`webhook-${event.id}`);
                if (existing) continue;
              }

              await queue.add(
                "process-meta-webhook",
                { eventId: event.id },
                {
                  jobId: reason === "stale_processing"
                    ? `webhook-${event.id}-reconcile-${Math.floor(now.getTime() / WEBHOOK_RECONCILE_INTERVAL_MS)}`
                    : `webhook-${event.id}`,
                },
              );'''
          new_reconcile = '''    const jobId = `webhook-${event.id}`;
              const existing = await queue.getJob(jobId);
              if (existing) {
                const state = await existing.getState();
                if (["active", "waiting", "delayed", "prioritized", "waiting-children"].includes(state)) {
                  continue;
                }
                try {
                  await existing.remove();
                } catch (error) {
                  log.warn("webhook_reconciliation_terminal_job_remove_failed", {
                    eventId: event.id,
                    jobId,
                    state,
                    error,
                  });
                  continue;
                }
              }

              if (reason === "stale_processing") {
                if (!event.processingStartedAt) continue;
                const [recovered] = await db
                  .update(schema.webhookEvents)
                  .set({
                    processingStatus: "retry",
                    processingStartedAt: null,
                    lastProcessingError: "Reconciliation recovered a stale webhook processing claim",
                    nextRetryAt: now,
                  })
                  .where(and(
                    eq(schema.webhookEvents.id, event.id),
                    eq(schema.webhookEvents.processingStatus, "processing"),
                    eq(schema.webhookEvents.processingStartedAt, event.processingStartedAt),
                    isNull(schema.webhookEvents.processedAt),
                    isNull(schema.webhookEvents.deadLetteredAt),
                  ))
                  .returning({ id: schema.webhookEvents.id });
                if (!recovered) continue;
              }

              await queue.add(
                "process-meta-webhook",
                { eventId: event.id },
                { jobId },
              );'''

          for label, old, new in [
              ("claim fencing", old_claim, new_claim),
              ("oldest-unprocessed metric", old_metric, new_metric),
              ("stale reconciliation", old_reconcile, new_reconcile),
          ]:
              if old not in text:
                  raise SystemExit(f"Expected {label} block was not found")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Validate worker patch
        run: |
          bun test apps/worker/src/webhooks.test.ts
          bun run --filter @wa/worker typecheck
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/webhook-reliability-self-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/webhooks.ts .github/workflows/webhook-reliability-self-fix.yml
          git commit -m "fix: fence webhook reconciliation claims"
          git push origin HEAD:feat/webhook-reliability
