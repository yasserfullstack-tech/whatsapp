name: Production Infra

on:
  pull_request:
    paths:
      - ".github/workflows/production-infra.yml"
      - ".dockerignore"
      - ".env.production.example"
      - "apps/web/next.config.ts"
      - "apps/web/**"
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/**"
      - "docker-compose.production.yml"
      - "infra/docker/**"
      - "infra/production/**"
      - "scripts/qa/validate-production-infra.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-infra.yml"
      - ".dockerignore"
      - ".env.production.example"
      - "apps/web/next.config.ts"
      - "apps/web/**"
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/**"
      - "docker-compose.production.yml"
      - "infra/docker/**"
      - "infra/production/**"
      - "scripts/qa/validate-production-infra.sh"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate production deployment using disposable services
        run: bash scripts/qa/validate-production-infra.sh
