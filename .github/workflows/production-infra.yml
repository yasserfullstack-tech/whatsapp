name: Production Infra

on:
  pull_request:
    paths:
      - ".github/workflows/production-infra.yml"
      - ".dockerignore"
      - ".env.production.example"
      - "package.json"
      - "bun.lock"
      - "apps/web/next.config.ts"
      - "apps/web/**"
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/**"
      - "docker-compose.production.yml"
      - "infra/docker/**"
      - "infra/production/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-infra.yml"
      - ".dockerignore"
      - ".env.production.example"
      - "package.json"
      - "bun.lock"
      - "apps/web/next.config.ts"
      - "apps/web/**"
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/**"
      - "docker-compose.production.yml"
      - "infra/docker/**"
      - "infra/production/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Prepare placeholder production environment
        run: |
          cp .env.production.example .env.production.ci
          sed -i \
            -e 's|^WEB_IMAGE=.*|WEB_IMAGE=whatsapp-web:local|' \
            -e 's|^API_IMAGE=.*|API_IMAGE=whatsapp-api:local|' \
            -e 's|^WORKER_IMAGE=.*|WORKER_IMAGE=whatsapp-worker:local|' \
            -e 's|^MIGRATOR_IMAGE=.*|MIGRATOR_IMAGE=whatsapp-migrator:local|' \
            .env.production.ci

      - name: Validate shell scripts
        run: |
          sh -n infra/production/scripts/backup-postgres.sh
          sh -n infra/production/scripts/verify-postgres-backup.sh
          sh -n infra/production/scripts/smoke-test.sh

      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.ci -f docker-compose.production.yml config --quiet

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e APP_DOMAIN=example.test \
            -e CADDY_EMAIL=ops@example.test \
            -e CADDY_MAX_REQUEST_BODY=16MB \
            -v "$PWD/infra/production/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate Prometheus configuration
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/infra/production/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:v3.13.3 \
            check config /etc/prometheus/prometheus.yml

      - name: Build production images with immutable revision metadata
        shell: bash
        run: |
          set -euo pipefail
          build_args=(
            --build-arg "IMAGE_SOURCE=https://github.com/${GITHUB_REPOSITORY}"
            --build-arg "IMAGE_REVISION=${GITHUB_SHA}"
            --build-arg "IMAGE_VERSION=${GITHUB_SHA}"
          )
          docker build -f infra/docker/web.Dockerfile "${build_args[@]}" -t whatsapp-web:local -t "whatsapp-web:${GITHUB_SHA}" .
          docker build -f infra/docker/api.Dockerfile "${build_args[@]}" -t whatsapp-api:local -t "whatsapp-api:${GITHUB_SHA}" .
          docker build -f infra/docker/worker.Dockerfile "${build_args[@]}" -t whatsapp-worker:local -t "whatsapp-worker:${GITHUB_SHA}" .
          docker build -f infra/docker/api.Dockerfile --target migrator "${build_args[@]}" -t whatsapp-migrator:local -t "whatsapp-migrator:${GITHUB_SHA}" .

      - name: Verify image revision and source labels
        shell: bash
        run: |
          set -euo pipefail
          expected_source="https://github.com/${GITHUB_REPOSITORY}"
          for image in whatsapp-web whatsapp-api whatsapp-worker whatsapp-migrator; do
            ref="${image}:${GITHUB_SHA}"
            revision="$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            source="$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
            version="$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
            test "$revision" = "$GITHUB_SHA"
            test "$version" = "$GITHUB_SHA"
            test "$source" = "$expected_source"
          done

      - name: Record web image HIGH/CRITICAL vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: whatsapp-web:${{ github.sha }}
          format: json
          output: trivy-web.json
          exit-code: "0"
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Record API image HIGH/CRITICAL vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: whatsapp-api:${{ github.sha }}
          format: json
          output: trivy-api.json
          exit-code: "0"
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-setup-trivy: "true"

      - name: Record worker image HIGH/CRITICAL vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: whatsapp-worker:${{ github.sha }}
          format: json
          output: trivy-worker.json
          exit-code: "0"
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-setup-trivy: "true"

      - name: Record migrator image HIGH/CRITICAL vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: whatsapp-migrator:${{ github.sha }}
          format: json
          output: trivy-migrator.json
          exit-code: "0"
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-setup-trivy: "true"

      - name: Upload container vulnerability reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-production-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-*.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce web image vulnerability policy
        id: policy_web
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: whatsapp-web:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-setup-trivy: "true"

      - name: Enforce API image vulnerability policy
        id: policy_api
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: whatsapp-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-setup-trivy: "true"

      - name: Enforce worker image vulnerability policy
        id: policy_worker
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: whatsapp-worker:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-setup-trivy: "true"

      - name: Enforce migrator image vulnerability policy
        id: policy_migrator
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: whatsapp-migrator:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-setup-trivy: "true"

      - name: Require every production image to pass the blocking vulnerability policy
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "web:${{ steps.policy_web.outcome }}" \
            "api:${{ steps.policy_api.outcome }}" \
            "worker:${{ steps.policy_worker.outcome }}" \
            "migrator:${{ steps.policy_migrator.outcome }}"; do
            image="${result%%:*}"
            outcome="${result#*:}"
            if [ "$outcome" != "success" ]; then
              echo "${image} image failed the blocking HIGH/CRITICAL vulnerability policy." >&2
              failed=1
            fi
          done
          exit "$failed"

      - name: Start production dependencies
        run: docker compose --env-file .env.production.ci -f docker-compose.production.yml up -d --no-build postgres valkey

      - name: Run migrations before application startup
        run: docker compose --env-file .env.production.ci -f docker-compose.production.yml --profile ops run --rm migrate

      - name: Start web API and one worker
        run: docker compose --env-file .env.production.ci -f docker-compose.production.yml up -d --no-build web api worker

      - name: Health endpoint smoke test
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local name=$1
            shift
            for attempt in $(seq 1 40); do
              if "$@"; then
                echo "$name is ready"
                return 0
              fi
              sleep 2
            done
            echo "$name did not become ready" >&2
            docker compose --env-file .env.production.ci -f docker-compose.production.yml ps
            return 1
          }

          retry web docker compose --env-file .env.production.ci -f docker-compose.production.yml exec -T web \
            node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"

          retry api docker compose --env-file .env.production.ci -f docker-compose.production.yml exec -T api \
            bun -e "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"

          retry worker docker compose --env-file .env.production.ci -f docker-compose.production.yml exec -T worker \
            bun -e "fetch('http://127.0.0.1:9464/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"

          docker compose --env-file .env.production.ci -f docker-compose.production.yml exec -T api \
            bun -e "fetch('http://127.0.0.1:4000/metrics').then(r=>r.text()).then(t=>process.exit(t.includes('whatsapp_http_requests_total')?0:1)).catch(()=>process.exit(1))"

          docker compose --env-file .env.production.ci -f docker-compose.production.yml exec -T worker \
            bun -e "fetch('http://127.0.0.1:9464/metrics').then(r=>r.text()).then(t=>process.exit(t.includes('whatsapp_queue_depth')?0:1)).catch(()=>process.exit(1))"

      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env.production.ci -f docker-compose.production.yml logs --no-color --tail=200

      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.production.ci -f docker-compose.production.yml --profile ops down -v --remove-orphans
