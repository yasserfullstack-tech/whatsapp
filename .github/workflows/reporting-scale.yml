name: Reporting Scale

on:
  pull_request:
    paths:
      - "apps/web/app/reports/**"
      - "apps/web/app/api/reports/**"
      - "apps/web/components/reporting-view.tsx"
      - "apps/web/lib/reporting*.ts"
      - "apps/load-test/src/reporting.ts"
      - "packages/db/**"
      - ".github/workflows/reporting-scale.yml"
  workflow_dispatch:

jobs:
  reporting-scale:
    name: ${{ matrix.name }} reporting dataset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: small
            recipients: 1000
            campaigns: 1
            phone_numbers: 1
          - name: 100k
            recipients: 100000
            campaigns: 5
            phone_numbers: 2
          - name: 500k
            recipients: 500000
            campaigns: 10
            phone_numbers: 3
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: whatsapp
          POSTGRES_USER: whatsapp
          POSTGRES_PASSWORD: whatsapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whatsapp -d whatsapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://whatsapp:whatsapp@localhost:5432/whatsapp
      REPORT_RECIPIENTS: ${{ matrix.recipients }}
      REPORT_CAMPAIGNS: ${{ matrix.campaigns }}
      REPORT_PHONE_NUMBERS: ${{ matrix.phone_numbers }}
      # Each matrix job owns a disposable PostgreSQL service container, so
      # cascading fixture deletion only wastes CI time after measurements.
      REPORT_KEEP_DATA: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Apply migrations
        run: bun run db:migrate
      - name: Benchmark reporting aggregation
        run: bun run --filter @wa/load-test reporting
