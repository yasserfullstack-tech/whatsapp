name: Load Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: 1k campaign and webhook smoke
        run: bun run test:load-smoke
      - name: Cleanup load infrastructure
        if: always()
        run: bun run load:infra:down
