name: Workspace settings migration rebuild

on:
  push:
    branches: [feat/workspace-settings]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: whatsapp
          POSTGRES_USER: whatsapp
          POSTGRES_PASSWORD: whatsapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whatsapp -d whatsapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://whatsapp:whatsapp@localhost:5432/whatsapp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workspace-settings
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Generate reconciled workspace-settings migration
        run: bun run db:generate -- --name=workspace-settings
      - name: Apply migrations to clean PostgreSQL
        run: bun run db:migrate
      - name: Verify migrated schema
        run: bun run db:verify
      - name: Unit and type checks
        run: |
          bun run test
          bun run typecheck
      - name: Commit generated migration and remove temporary workflow
        run: |
          rm .github/workflows/workspace-settings-rebuild.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/db/drizzle .github/workflows/workspace-settings-rebuild.yml
          git commit -m "fix(workspace-settings): reconcile migration with main"
          git push origin HEAD:feat/workspace-settings
