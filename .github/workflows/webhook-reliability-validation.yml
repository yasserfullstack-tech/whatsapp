name: Webhook Reliability Load Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  load-validation:
    if: github.head_ref == 'feat/webhook-reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: 1k campaign smoke
        run: bun run load:run -- --scenario=baseline-80 --recipients=1000 --timeout-ms=120000
      - name: 1k webhook smoke
        run: bun run load:webhooks -- --events=1000 --concurrency=50 --timeout-ms=120000
      - name: Cleanup load infrastructure
        if: always()
        run: bun run load:infra:down

  webhook-flood-100k:
    if: github.head_ref == 'feat/webhook-reliability'
    needs: load-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: 100k webhook flood
        run: bun run load:webhooks -- --events=100000 --concurrency=400 --timeout-ms=300000
      - name: Cleanup load infrastructure
        if: always()
        run: bun run load:infra:down
