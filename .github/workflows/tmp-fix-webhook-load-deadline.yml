name: Temporary webhook load harness deadline fix

on:
  push:
    branches: [feat/webhook-reliability]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/webhook-reliability
      - name: Bound the full webhook flood runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/load-test/src/webhook-flood.ts')
          text = path.read_text()

          old = '    const floodStartedAt = Date.now();\n\n    const sender = async () => {'
          new = '    const floodStartedAt = Date.now();\n    const deadline = floodStartedAt + timeoutMs;\n\n    const sender = async () => {'
          if old not in text:
              raise SystemExit('could not find flood start anchor')
          text = text.replace(old, new, 1)

          old = '        if (index >= events) return;\n\n        const body = JSON.stringify({'
          new = '        if (index >= events) return;\n        if (Date.now() >= deadline) return;\n\n        const body = JSON.stringify({'
          if old not in text:
              raise SystemExit('could not find sender deadline anchor')
          text = text.replace(old, new, 1)

          old = '            },\n            body,\n          });'
          new = '            },\n            body,\n            signal: AbortSignal.timeout(Math.max(1, Math.min(30_000, deadline - Date.now()))),\n          });'
          if old not in text:
              raise SystemExit('could not find fetch options anchor')
          text = text.replace(old, new, 1)

          old = '    const deadline = Date.now() + timeoutMs;\n    let processed = 0;'
          new = '    let processed = 0;'
          if old not in text:
              raise SystemExit('could not find drain deadline anchor')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/load-test/src/webhook-flood.ts
          git commit -m "fix(load): bound webhook flood runtime"
          git push origin HEAD:feat/webhook-reliability
