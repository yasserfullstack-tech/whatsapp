name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Fail on high or critical dependency vulnerabilities
        run: bun audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v4

  security-e2e:
    name: Tenant isolation and API abuse tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: whatsapp_qa_security
          POSTGRES_USER: whatsapp
          POSTGRES_PASSWORD: whatsapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whatsapp -d whatsapp_qa_security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      QA_DISPOSABLE_INFRA: "1"
      DATABASE_URL: postgres://whatsapp:whatsapp@localhost:5432/whatsapp_qa_security
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-better-auth
      AUTH_EMAIL_CAPTURE_FILE: /tmp/wa-auth-security-emails.jsonl
      AUTH_SIGNIN_RATE_LIMIT_MAX: "100"
      AUTH_SIGNUP_RATE_LIMIT_MAX: "100"
      META_GRAPH_API_VERSION: v26.0
      META_APP_ID: "123456789"
      META_APP_SECRET: ci-only-meta-secret
      META_CONFIG_ID: ci-only-config-id
      META_VERIFY_TOKEN: ci-only-verify-token
      R2_ACCOUNT_ID: ci-only-r2-account
      R2_ACCESS_KEY_ID: ci-only-r2-access-key
      R2_SECRET_ACCESS_KEY: ci-only-r2-secret-key
      R2_BUCKET: ci-only-r2-bucket
      E2E_META_BASE_URL: http://127.0.0.1:4777
      R2_ENDPOINT: http://127.0.0.1:4569
      E2E_BLOCK_EXTERNAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Create ephemeral encryption key
        shell: bash
        run: echo "CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Verify isolated test environment
        run: bun scripts/qa/assert-test-env.ts
      - run: bun install --frozen-lockfile
      - name: Apply migrations
        run: bun run db:migrate
      - name: Build web application
        run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run security E2E suite
        run: bun run test:security

  security-gate:
    name: Security gate
    if: always()
    needs: [dependency-audit, secret-scan, codeql, security-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every security lane
        run: |
          test "${{ needs.dependency-audit.result }}" = "success"
          test "${{ needs.secret-scan.result }}" = "success"
          test "${{ needs.codeql.result }}" = "success"
          test "${{ needs.security-e2e.result }}" = "success"
