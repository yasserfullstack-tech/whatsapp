name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - "test/security-*"
      - "fix/security-*"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies from frozen lockfile
        run: bun ci
      - name: Fail on high or critical dependency vulnerabilities
        run: bun audit --audit-level=high

  # container-supply-chain: guards the PR-021 controls (issue #66). The policy in
  # docs/container-supply-chain-security.md is only real while the workflows and
  # Dockerfiles still implement it, so this job fails if a frozen install, an
  # image scan, the blocking severity policy, or an OCI provenance label is
  # removed or weakened. See infra/production/scripts/check-container-supply-chain.ts.
  container-supply-chain:
    name: Container and supply-chain controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Verify GitHub Actions use immutable revisions
        run: bun infra/production/scripts/check-github-action-pins.ts
      - name: Verify container and supply-chain controls are wired
        run: bun infra/production/scripts/check-container-supply-chain.ts

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4

  security-e2e:
    name: Tenant isolation and API abuse tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: whatsapp
          POSTGRES_USER: whatsapp
          POSTGRES_PASSWORD: whatsapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whatsapp -d whatsapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://whatsapp:whatsapp@localhost:5432/whatsapp
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-better-auth
      AUTH_EMAIL_CAPTURE_FILE: /tmp/wa-auth-emails.jsonl
      AUTH_SIGNIN_RATE_LIMIT_MAX: "100"
      AUTH_SIGNUP_RATE_LIMIT_MAX: "100"
      META_GRAPH_API_VERSION: v26.0
      META_APP_ID: "123456789"
      META_APP_SECRET: ci-only-meta-secret
      META_CONFIG_ID: ci-only-config-id
      META_VERIFY_TOKEN: ci-only-verify-token
      R2_ACCOUNT_ID: ci-only-r2-account
      R2_ACCESS_KEY_ID: ci-only-r2-access-key
      R2_SECRET_ACCESS_KEY: ci-only-r2-secret-key
      R2_BUCKET: ci-only-r2-bucket
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Create ephemeral encryption key
        shell: bash
        run: echo "CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Install dependencies from frozen lockfile
        run: bun ci
      - name: Apply migrations
        run: bun run db:migrate
      - name: Build web application
        run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run security E2E suite
        run: bun run test:security
