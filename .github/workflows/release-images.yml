name: Release Images

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA already merged into main
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify release SHA is reviewed main history
        id: release
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be a full 40-character hexadecimal Git SHA" >&2
            exit 1
          fi

          resolved="$(git rev-parse HEAD)"
          if [ "$resolved" != "$RELEASE_SHA" ]; then
            echo "Checked out $resolved, expected $RELEASE_SHA" >&2
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "Refusing to publish: $RELEASE_SHA is not in protected main history" >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          run_tag="sha-${RELEASE_SHA}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "run_tag=$run_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: ghcr.io/${{ steps.release.outputs.owner }}/whatsapp-web:${{ steps.release.outputs.run_tag }}
          build-args: |
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
            IMAGE_REVISION=${{ steps.release.outputs.sha }}
            IMAGE_VERSION=${{ steps.release.outputs.sha }}

      - name: Build and push API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ghcr.io/${{ steps.release.outputs.owner }}/whatsapp-api:${{ steps.release.outputs.run_tag }}
          build-args: |
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
            IMAGE_REVISION=${{ steps.release.outputs.sha }}
            IMAGE_VERSION=${{ steps.release.outputs.sha }}

      - name: Build and push worker image
        id: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: true
          tags: ghcr.io/${{ steps.release.outputs.owner }}/whatsapp-worker:${{ steps.release.outputs.run_tag }}
          build-args: |
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
            IMAGE_REVISION=${{ steps.release.outputs.sha }}
            IMAGE_VERSION=${{ steps.release.outputs.sha }}

      - name: Build and push migrator image
        id: migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: migrator
          push: true
          tags: ghcr.io/${{ steps.release.outputs.owner }}/whatsapp-migrator:${{ steps.release.outputs.run_tag }}
          build-args: |
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
            IMAGE_REVISION=${{ steps.release.outputs.sha }}
            IMAGE_VERSION=${{ steps.release.outputs.sha }}

      - name: Record release dependency HIGH/CRITICAL vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-release-dependencies.json
          exit-code: "0"
          vuln-type: library
          severity: HIGH,CRITICAL

      - name: Record release web image HIGH/CRITICAL vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.release.outputs.owner }}/whatsapp-web@${{ steps.web.outputs.digest }}
          format: json
          output: trivy-release-web.json
          exit-code: "0"
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-setup-trivy: "true"

      - name: Record release API image HIGH/CRITICAL vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.release.outputs.owner }}/whatsapp-api@${{ steps.api.outputs.digest }}
          format: json
          output: trivy-release-api.json
          exit-code: "0"
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-setup-trivy: "true"

      - name: Record release worker image HIGH/CRITICAL vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.release.outputs.owner }}/whatsapp-worker@${{ steps.worker.outputs.digest }}
          format: json
          output: trivy-release-worker.json
          exit-code: "0"
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-setup-trivy: "true"

      - name: Record release migrator image HIGH/CRITICAL vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.release.outputs.owner }}/whatsapp-migrator@${{ steps.migrator.outputs.digest }}
          format: json
          output: trivy-release-migrator.json
          exit-code: "0"
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-setup-trivy: "true"

      - name: Upload release vulnerability reports
        uses: actions/upload-artifact@v4
        with:
          name: release-security-${{ steps.release.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-release-*.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce release dependency vulnerability policy
        id: policy_dependencies
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: library
          severity: HIGH,CRITICAL
          skip-setup-trivy: "true"

      - name: Enforce release web image vulnerability policy
        id: policy_web
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.release.outputs.owner }}/whatsapp-web@${{ steps.web.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-setup-trivy: "true"

      - name: Enforce release API image vulnerability policy
        id: policy_api
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.release.outputs.owner }}/whatsapp-api@${{ steps.api.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-setup-trivy: "true"

      - name: Enforce release worker image vulnerability policy
        id: policy_worker
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.release.outputs.owner }}/whatsapp-worker@${{ steps.worker.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-setup-trivy: "true"

      - name: Enforce release migrator image vulnerability policy
        id: policy_migrator
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.release.outputs.owner }}/whatsapp-migrator@${{ steps.migrator.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-setup-trivy: "true"

      - name: Require actual release digests to pass the blocking vulnerability policy
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "dependencies:${{ steps.policy_dependencies.outcome }}" \
            "web:${{ steps.policy_web.outcome }}" \
            "api:${{ steps.policy_api.outcome }}" \
            "worker:${{ steps.policy_worker.outcome }}" \
            "migrator:${{ steps.policy_migrator.outcome }}"; do
            target="${result%%:*}"
            outcome="${result#*:}"
            if [ "$outcome" != "success" ]; then
              echo "${target} failed the blocking HIGH/CRITICAL vulnerability policy." >&2
              failed=1
            fi
          done
          exit "$failed"

      - name: Write and validate safe release manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cat > release/release.env <<EOF
          # Safe release manifest: exact source SHA and immutable image digests only.
          RELEASE_SHA=${{ steps.release.outputs.sha }}
          WEB_IMAGE=ghcr.io/${{ steps.release.outputs.owner }}/whatsapp-web@${{ steps.web.outputs.digest }}
          API_IMAGE=ghcr.io/${{ steps.release.outputs.owner }}/whatsapp-api@${{ steps.api.outputs.digest }}
          WORKER_IMAGE=ghcr.io/${{ steps.release.outputs.owner }}/whatsapp-worker@${{ steps.worker.outputs.digest }}
          MIGRATOR_IMAGE=ghcr.io/${{ steps.release.outputs.owner }}/whatsapp-migrator@${{ steps.migrator.outputs.digest }}
          EOF

          sh infra/production/scripts/check-immutable-images.sh release/release.env
          cat release/release.env

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-images-${{ steps.release.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/release.env
          if-no-files-found: error
          retention-days: 90

      - name: Summarize release images
        shell: bash
        run: |
          {
            echo '## Immutable release images'
            echo
            echo '```env'
            cat release/release.env
            echo '```'
            echo
            echo 'Use the @sha256: references from this manifest in the host-only staging/production env file.'
          } >> "$GITHUB_STEP_SUMMARY"
