name: Generate onboarding migration snapshot

on:
  push:
    branches: [feat/onboarding-v2]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://whatsapp:whatsapp@localhost:5432/whatsapp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/onboarding-v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Regenerate onboarding migration and compressed snapshot
        shell: bash
        run: |
          rm -f packages/db/drizzle/0005_onboarding-v2.sql
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'packages/db/drizzle/meta/_journal.json';
          const journal = JSON.parse(fs.readFileSync(path, 'utf8'));
          journal.entries = journal.entries.filter((entry) => entry.tag !== '0005_onboarding-v2');
          fs.writeFileSync(path, `${JSON.stringify(journal, null, 2)}\n`);
          NODE
          bun run db:generate -- --name=onboarding-v2
      - name: Commit generated migration metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/drizzle
          if git diff --cached --quiet; then
            echo "No generated migration changes"
            exit 0
          fi
          git commit -m "chore(db): sync onboarding migration snapshot"
          git push origin HEAD:feat/onboarding-v2
