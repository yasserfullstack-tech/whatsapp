name: Fix onboarding mobile E2E coverage

on:
  push:
    branches: [feat/onboarding-v2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/onboarding-v2
      - name: Preserve mobile and Arabic onboarding coverage in one functional run
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('e2e/onboarding.e2e.ts')
          text = path.read_text()
          needle = '  await page.getByRole("button", { name: "العربية" }).click();\n'
          replacement = '  await page.setViewportSize({ width: 390, height: 844 });\n  await page.getByRole("button", { name: "العربية" }).click();\n'
          if replacement not in text:
              if needle not in text:
                  raise SystemExit('Arabic onboarding switch marker not found')
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add e2e/onboarding.e2e.ts
          git commit -m "test(onboarding): exercise Arabic flow at mobile width"
          git push origin HEAD:feat/onboarding-v2
