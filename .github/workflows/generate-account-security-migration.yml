name: Generate account security migration

on:
  push:
    branches: [feat/account-security]
    paths:
      - packages/db/src/schema.ts

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://whatsapp:whatsapp@localhost:5432/whatsapp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/account-security
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bun run db:generate -- --name=account-security
      - name: Commit generated Drizzle migration
        run: |
          if [ -z "$(git status --porcelain -- packages/db/drizzle)" ]; then
            echo "No migration changes generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/drizzle
          git commit -m "chore(db): generate account security migration"
          git push origin HEAD:feat/account-security
