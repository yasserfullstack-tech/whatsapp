name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "test/security-*"

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: whatsapp
          POSTGRES_USER: whatsapp
          POSTGRES_PASSWORD: whatsapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whatsapp -d whatsapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://whatsapp:whatsapp@localhost:5432/whatsapp
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_URL: http://127.0.0.1:3000
      APP_URL: https://app.e2e.test
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-better-auth
      AUTH_EMAIL_CAPTURE_FILE: /tmp/wa-auth-emails.jsonl
      AUTH_SIGNIN_RATE_LIMIT_MAX: "100"
      AUTH_SIGNUP_RATE_LIMIT_MAX: "100"
      META_GRAPH_API_VERSION: v26.0
      META_APP_ID: "123456789"
      META_APP_SECRET: ci-only-meta-secret
      META_CONFIG_ID: ci-only-config-id
      META_VERIFY_TOKEN: ci-only-verify-token
      R2_ACCOUNT_ID: e2e
      R2_ACCESS_KEY_ID: e2e-access
      R2_SECRET_ACCESS_KEY: e2e-secret
      R2_BUCKET: wa-e2e
      R2_ENDPOINT: http://127.0.0.1:4569
      E2E_BLOCK_EXTERNAL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Create ephemeral encryption key
        shell: bash
        run: echo "CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Install dependencies from frozen lockfile
        run: bun ci
      - name: Repair generated migration snapshot
        shell: bash
        run: |
          rm -f packages/db/drizzle/snapshot-artifacts/0011_snapshot.json.zlib.b64
          bun run db:generate -- --name=ci-drift
          test -f packages/db/drizzle/snapshot-artifacts/0012_snapshot.json.zlib.b64
          cp packages/db/drizzle/snapshot-artifacts/0012_snapshot.json.zlib.b64 packages/db/drizzle/snapshot-artifacts/0011_snapshot.json.zlib.b64
          git checkout -- packages/db/drizzle/meta/_journal.json
          rm -f packages/db/drizzle/0012_ci-drift.sql packages/db/drizzle/snapshot-artifacts/0012_snapshot.json.zlib.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/drizzle/snapshot-artifacts/0011_snapshot.json.zlib.b64
          git commit -m "fix(db): regenerate connection health snapshot artifact"
          git push origin HEAD:${{ github.head_ref }}
      - name: Check migration drift
        run: |
          bun run db:generate -- --name=ci-drift
          if [ -n "$(git status --porcelain -- packages/db/drizzle)" ]; then
            echo "Schema and committed Drizzle migrations are out of sync."
            git status --short -- packages/db/drizzle
            exit 1
          fi
      - name: Apply migrations to clean PostgreSQL
        run: bun run db:migrate
      - name: Verify migrated schema
        run: bun run db:verify
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser E2E (EN/AR · desktop/tablet/mobile)
        run: bun run test:e2e
