name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: whatsapp_qa_ci
          POSTGRES_USER: whatsapp
          POSTGRES_PASSWORD: whatsapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whatsapp -d whatsapp_qa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      QA_DISPOSABLE_INFRA: "1"
      DATABASE_URL: postgres://whatsapp:whatsapp@localhost:5432/whatsapp_qa_ci
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-better-auth
      AUTH_EMAIL_CAPTURE_FILE: /tmp/wa-auth-emails.jsonl
      AUTH_SIGNIN_RATE_LIMIT_MAX: "100"
      AUTH_SIGNUP_RATE_LIMIT_MAX: "100"
      META_GRAPH_API_VERSION: v26.0
      META_APP_ID: "123456789"
      META_APP_SECRET: ci-only-meta-secret
      META_CONFIG_ID: ci-only-config-id
      META_VERIFY_TOKEN: ci-only-verify-token
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Create ephemeral encryption key
        shell: bash
        run: echo "CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Verify isolated test environment
        run: bun scripts/qa/assert-test-env.ts
      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile
      - name: Verify QA coverage manifest
        run: bun run qa:coverage
      - name: Check migration drift
        run: |
          bun run db:generate -- --name=ci-drift
          if [ -n "$(git status --porcelain -- packages/db/drizzle)" ]; then
            echo "Schema and committed Drizzle migrations are out of sync."
            git status --short -- packages/db/drizzle
            exit 1
          fi
      - name: Apply migrations to clean PostgreSQL
        run: bun run db:migrate
      - name: Verify migrated schema
        run: bun run db:verify
      - name: Unit and integration tests
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Production build
        run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser smoke
        run: bun run test:e2e:smoke

  browser-smoke:
    name: Browser smoke
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - run: echo "Browser smoke passed inside the CI job without rebuilding the application a second time."
