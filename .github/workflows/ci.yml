name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://whatsapp:whatsapp@localhost:5432/whatsapp
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-better-auth
      CREDENTIAL_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      META_GRAPH_API_VERSION: v26.0
      META_APP_ID: "123456789"
      META_APP_SECRET: ci-only-meta-secret
      META_CONFIG_ID: ci-only-config-id
      META_VERIFY_TOKEN: ci-only-verify-token
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Generate migration baseline for capture
        working-directory: packages/db
        run: |
          bun run db:generate -- --name=baseline
          echo '=== GENERATED FILES ==='
          find drizzle -type f -maxdepth 2 -print | sort
          echo '=== 0000 SQL ==='
          cat drizzle/0000_*.sql
          echo '=== JOURNAL ==='
          cat drizzle/meta/_journal.json
          echo '=== SNAPSHOT BASE64 ==='
          base64 -w0 drizzle/meta/0000_snapshot.json
          echo
          echo '=== END SNAPSHOT BASE64 ==='
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
