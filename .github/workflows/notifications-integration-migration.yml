name: Notifications Integration Migration

on:
  push:
    branches: [feat/notifications]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Generate canonical migration
        run: bun run db:generate -- --name=notifications
      - name: Commit generated migration metadata
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- packages/db/drizzle)" ]; then
            echo "No migration changes generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/drizzle
          git commit -m "chore: generate canonical notifications migration"
          git push
