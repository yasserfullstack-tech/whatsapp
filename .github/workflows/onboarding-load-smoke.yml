name: Onboarding Load Smoke

on:
  push:
    branches: [feat/onboarding-v2]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: 1k campaign smoke
        run: bun run load:run -- --scenario=baseline-80 --recipients=1000 --timeout-ms=120000
      - name: 1k webhook smoke
        run: bun run load:webhooks -- --events=1000 --concurrency=50 --timeout-ms=120000
      - name: Cleanup load infrastructure
        if: always()
        run: bun run load:infra:down
