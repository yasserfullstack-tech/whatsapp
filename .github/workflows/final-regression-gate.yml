name: Final Regression Gate

on:
  push:
    branches: [test/full-regression-gate-final]
  workflow_dispatch:

concurrency:
  group: final-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application-regression:
    name: Application and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: whatsapp
          POSTGRES_USER: whatsapp
          POSTGRES_PASSWORD: whatsapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whatsapp -d whatsapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://whatsapp:whatsapp@localhost:5432/whatsapp
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_URL: http://127.0.0.1:3000
      APP_URL: https://app.e2e.test
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-better-auth
      AUTH_EMAIL_CAPTURE_FILE: /tmp/wa-auth-emails.jsonl
      AUTH_SIGNIN_RATE_LIMIT_MAX: "100"
      AUTH_SIGNUP_RATE_LIMIT_MAX: "100"
      META_GRAPH_API_VERSION: v26.0
      META_APP_ID: "123456789"
      META_APP_SECRET: ci-only-meta-secret
      META_CONFIG_ID: ci-only-config-id
      META_VERIFY_TOKEN: ci-only-verify-token
      R2_ACCOUNT_ID: e2e
      R2_ACCESS_KEY_ID: e2e-access
      R2_SECRET_ACCESS_KEY: e2e-secret
      R2_BUCKET: wa-e2e
      R2_ENDPOINT: http://127.0.0.1:4569
      E2E_BLOCK_EXTERNAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Create ephemeral encryption key
        shell: bash
        run: echo "CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: bun install
      - name: Check migration drift
        run: |
          bun run db:generate -- --name=final-regression-drift
          if [ -n "$(git status --porcelain -- packages/db/drizzle)" ]; then
            echo "Schema and committed Drizzle migrations are out of sync."
            git status --short -- packages/db/drizzle
            exit 1
          fi
      - name: Apply migrations
        run: bun run db:migrate
      - name: Verify migrated schema
        run: bun run db:verify
      - name: Unit and integration tests
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Production web build
        run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser E2E
        run: bun run test:e2e

  security-regression:
    name: Tenant isolation and API abuse regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: whatsapp
          POSTGRES_USER: whatsapp
          POSTGRES_PASSWORD: whatsapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whatsapp -d whatsapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://whatsapp:whatsapp@localhost:5432/whatsapp
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-better-auth
      AUTH_EMAIL_CAPTURE_FILE: /tmp/wa-auth-emails.jsonl
      AUTH_SIGNIN_RATE_LIMIT_MAX: "100"
      AUTH_SIGNUP_RATE_LIMIT_MAX: "100"
      META_GRAPH_API_VERSION: v26.0
      META_APP_ID: "123456789"
      META_APP_SECRET: ci-only-meta-secret
      META_CONFIG_ID: ci-only-config-id
      META_VERIFY_TOKEN: ci-only-verify-token
      R2_ACCOUNT_ID: ci-only-r2-account
      R2_ACCESS_KEY_ID: ci-only-r2-access-key
      R2_SECRET_ACCESS_KEY: ci-only-r2-secret-key
      R2_BUCKET: ci-only-r2-bucket
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Create ephemeral encryption key
        shell: bash
        run: echo "CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: bun install
      - name: Apply migrations
        run: bun run db:migrate
      - name: Build web application
        run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Security E2E
        run: bun run test:security

  load-resilience:
    name: Safe local load and recovery regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOAD_ALLOW_REMOTE: "0"
      LOAD_DATABASE_URL: postgres://whatsapp:whatsapp@127.0.0.1:55432/whatsapp_load
      LOAD_REDIS_URL: redis://127.0.0.1:56379
      META_GRAPH_API_VERSION: v26.0
      META_APP_ID: "123456789"
      META_APP_SECRET: ci-only-meta-secret
      META_CONFIG_ID: ci-only-config-id
      META_VERIFY_TOKEN: ci-only-verify-token
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Verify load-test safety gates
        run: bun apps/load-test/src/safety-gates.ts
      - name: Progressive load smoke
        run: bun run load:stress -- --profile=pr --webhook-events=1000 --webhook-concurrency=50
      - name: Duplicate and out-of-order webhook smoke
        run: bun run load:webhook-status -- --recipients=1000 --concurrency=50 --timeout-ms=120000
      - name: Retry and recovery smoke
        run: |
          bun run load:recovery -- --mode=429 --recipients=250 --fault-after-ms=1200 --timeout-ms=90000 --runner-timeout-ms=120000
          bun run load:recovery -- --mode=500 --recipients=250 --fault-after-ms=1200 --timeout-ms=90000 --runner-timeout-ms=120000
          bun run load:recovery -- --mode=mixed --recipients=250 --fault-after-ms=1200 --timeout-ms=90000 --runner-timeout-ms=120000
      - name: Valkey and worker restart durability smoke
        run: |
          bun run load:chaos -- --chaos=redis-restart --scenario=baseline-80 --recipients=1000 --fault-after-ms=3000 --timeout-ms=180000
          bun run load:chaos -- --chaos=worker-restart --scenario=baseline-80 --recipients=1000 --fault-after-ms=3000 --timeout-ms=180000
      - name: Upload summarized load reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-regression-load-${{ github.run_id }}-${{ github.run_attempt }}
          path: load-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Cleanup isolated load infrastructure
        if: always()
        run: |
          bun run load:infra:down || true
          docker compose -f docker-compose.load-chaos.yml down --remove-orphans --volumes || true

  production-runtime:
    name: Production image and runtime regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare placeholder production environment
        run: |
          cp .env.production.example .env.production.ci
          sed -i \
            -e 's|^WEB_IMAGE=.*|WEB_IMAGE=whatsapp-web:local|' \
            -e 's|^API_IMAGE=.*|API_IMAGE=whatsapp-api:local|' \
            -e 's|^WORKER_IMAGE=.*|WORKER_IMAGE=whatsapp-worker:local|' \
            -e 's|^MIGRATOR_IMAGE=.*|MIGRATOR_IMAGE=whatsapp-migrator:local|' \
            .env.production.ci
      - name: Validate deployment configuration
        run: |
          sh -n infra/production/scripts/backup-postgres.sh
          sh -n infra/production/scripts/verify-postgres-backup.sh
          sh -n infra/production/scripts/smoke-test.sh
          docker compose --env-file .env.production.ci -f docker-compose.production.yml config --quiet
          docker run --rm \
            -e APP_DOMAIN=example.test \
            -e CADDY_EMAIL=ops@example.test \
            -e CADDY_MAX_REQUEST_BODY=16MB \
            -v "$PWD/infra/production/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/infra/production/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:v3.13.3 \
            check config /etc/prometheus/prometheus.yml
      - name: Build production images
        run: |
          docker build -f infra/docker/web.Dockerfile -t whatsapp-web:local .
          docker build -f infra/docker/api.Dockerfile -t whatsapp-api:local .
          docker build -f infra/docker/worker.Dockerfile -t whatsapp-worker:local .
          docker build -f infra/docker/api.Dockerfile --target migrator -t whatsapp-migrator:local .
      - name: Start production dependencies
        run: docker compose --env-file .env.production.ci -f docker-compose.production.yml up -d --no-build postgres valkey
      - name: Run migrations before application startup
        run: docker compose --env-file .env.production.ci -f docker-compose.production.yml --profile ops run --rm migrate
      - name: Start web API and one worker
        run: docker compose --env-file .env.production.ci -f docker-compose.production.yml up -d --no-build web api worker
      - name: Health endpoint smoke test
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local name=$1
            shift
            for attempt in $(seq 1 40); do
              if "$@"; then
                echo "$name is ready"
                return 0
              fi
              sleep 2
            done
            echo "$name did not become ready" >&2
            docker compose --env-file .env.production.ci -f docker-compose.production.yml ps
            return 1
          }
          retry web docker compose --env-file .env.production.ci -f docker-compose.production.yml exec -T web \
            node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          retry api docker compose --env-file .env.production.ci -f docker-compose.production.yml exec -T api \
            bun -e "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          retry worker docker compose --env-file .env.production.ci -f docker-compose.production.yml exec -T worker \
            bun -e "fetch('http://127.0.0.1:9464/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          docker compose --env-file .env.production.ci -f docker-compose.production.yml exec -T api \
            bun -e "fetch('http://127.0.0.1:4000/metrics').then(r=>r.text()).then(t=>process.exit(t.includes('whatsapp_http_requests_total')?0:1)).catch(()=>process.exit(1))"
          docker compose --env-file .env.production.ci -f docker-compose.production.yml exec -T worker \
            bun -e "fetch('http://127.0.0.1:9464/metrics').then(r=>r.text()).then(t=>process.exit(t.includes('whatsapp_queue_depth')?0:1)).catch(()=>process.exit(1))"
      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env.production.ci -f docker-compose.production.yml logs --no-color --tail=200
      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.production.ci -f docker-compose.production.yml --profile ops down -v --remove-orphans

  final-gate:
    name: Final integrated regression gate
    if: always()
    needs:
      - application-regression
      - security-regression
      - load-resilience
      - production-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Require every regression lane to pass
        shell: bash
        run: |
          test "${{ needs.application-regression.result }}" = "success"
          test "${{ needs.security-regression.result }}" = "success"
          test "${{ needs.load-resilience.result }}" = "success"
          test "${{ needs.production-runtime.result }}" = "success"
          echo "All final regression lanes passed."
