name: PR-021 Lockfile Repair

on:
  push:
    branches:
      - security/container-supply-chain

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/container-supply-chain
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Regenerate lockfile with the repository-pinned Bun version
        shell: bash
        run: |
          set -euo pipefail
          bun install --ignore-scripts
          git diff --exit-code --quiet -- bun.lock && {
            echo "bun.lock is already current."
            exit 0
          }
          git diff -- bun.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "fix: refresh Bun workspace lockfile"
          git push origin HEAD:security/container-supply-chain
