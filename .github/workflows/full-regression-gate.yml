name: Full Regression Gate

on:
  workflow_dispatch:
  push:
    branches: [test/full-regression-gate]

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  BETTER_AUTH_URL: http://127.0.0.1:3000
  BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-better-auth
  AUTH_SIGNIN_RATE_LIMIT_MAX: "100"
  AUTH_SIGNUP_RATE_LIMIT_MAX: "100"
  META_GRAPH_API_VERSION: v26.0
  META_APP_ID: "123456789"
  META_APP_SECRET: ci-only-meta-secret
  META_CONFIG_ID: ci-only-config-id
  META_VERIFY_TOKEN: ci-only-verify-token
  R2_ACCOUNT_ID: ci-only-r2-account
  R2_ACCESS_KEY_ID: ci-only-r2-access-key
  R2_SECRET_ACCESS_KEY: ci-only-r2-secret-key
  R2_BUCKET: ci-only-r2-bucket

jobs:
  core:
    name: Unit integration build and schema
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: whatsapp
          POSTGRES_USER: whatsapp
          POSTGRES_PASSWORD: whatsapp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whatsapp -d whatsapp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://whatsapp:whatsapp@localhost:5432/whatsapp
      REDIS_URL: redis://localhost:6379
      AUTH_EMAIL_CAPTURE_FILE: /tmp/wa-core-auth-emails.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - name: Create ephemeral encryption key
        run: echo "CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: bun scripts/qa/assert-test-env.ts
      - run: bun install --frozen-lockfile
      - name: Coverage manifest gate
        run: bun run qa:coverage
      - name: Migration drift gate
        run: |
          bun run db:generate -- --name=release-drift
          if [ -n "$(git status --porcelain -- packages/db/drizzle)" ]; then
            git status --short -- packages/db/drizzle
            exit 1
          fi
      - name: Clean database migrations
        run: bun run db:migrate
      - name: Schema verification
        run: bun run db:verify
      - name: Unit and integration tests
        run: bun run test
      - name: Critical webhook reliability regressions
        run: bun run test:webhook-critical
      - name: Typecheck
        run: bun run typecheck
      - name: Production build
        run: bun run build

  browser:
    name: Full browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: whatsapp_browser
          POSTGRES_USER: whatsapp
          POSTGRES_PASSWORD: whatsapp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whatsapp -d whatsapp_browser"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://whatsapp:whatsapp@localhost:5432/whatsapp_browser
      REDIS_URL: redis://localhost:6379
      AUTH_EMAIL_CAPTURE_FILE: /tmp/wa-browser-auth-emails.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - name: Create ephemeral encryption key
        run: echo "CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: bun scripts/qa/assert-test-env.ts
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run db:verify
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - name: Browser E2E across desktop tablet and mobile
        run: bun run test:e2e

  security:
    name: Security E2E and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: whatsapp_security
          POSTGRES_USER: whatsapp
          POSTGRES_PASSWORD: whatsapp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whatsapp -d whatsapp_security"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://whatsapp:whatsapp@localhost:5432/whatsapp_security
      REDIS_URL: redis://localhost:6379
      AUTH_EMAIL_CAPTURE_FILE: /tmp/wa-security-auth-emails.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - name: Create ephemeral encryption key
        run: echo "CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: bun scripts/qa/assert-test-env.ts
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run db:verify
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - name: Security E2E
        run: bun run test:security
      - name: Dependency audit
        run: bun audit --audit-level=high

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL static security analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  load-resilience:
    name: Load and resilience smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - name: 1k campaign plus webhook smoke
        run: bun run test:load-smoke
      - name: Worker restart resilience smoke
        run: bun run test:resilience-smoke
      - name: Upload load reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-load-results
          path: load-results/
          if-no-files-found: ignore
      - name: Cleanup isolated load infrastructure
        if: always()
        run: |
          bun run load:infra:down || true
          docker compose -f docker-compose.load-chaos.yml down -v --remove-orphans || true

  release-gate:
    name: Release gate
    if: always()
    needs: [core, browser, security, secret-scan, codeql, load-resilience]
    runs-on: ubuntu-latest
    steps:
      - name: Require every regression lane
        run: |
          test "${{ needs.core.result }}" = "success"
          test "${{ needs.browser.result }}" = "success"
          test "${{ needs.security.result }}" = "success"
          test "${{ needs.secret-scan.result }}" = "success"
          test "${{ needs.codeql.result }}" = "success"
          test "${{ needs.load-resilience.result }}" = "success"
