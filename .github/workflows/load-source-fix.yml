name: Load source fix

on:
  push:
    branches: [test/load-testing]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/load-testing
      - name: Fix Bun preload paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['apps/load-test/src/run.ts', 'apps/load-test/src/webhook-flood.ts']:
              path = Path(name)
              text = path.read_text()
              text = text.replace('"apps/load-test/src/fetch-redirect.ts"', '"./apps/load-test/src/fetch-redirect.ts"')
              path.write_text(text)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/load-test/src/run.ts apps/load-test/src/webhook-flood.ts
          git commit -m "fix(load-test): resolve Bun preload from repository root"
          git push origin HEAD:test/load-testing
