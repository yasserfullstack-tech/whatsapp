services:
  load-postgres:
    image: postgres:17-alpine
    container_name: whatsapp-load-postgres
    environment:
      POSTGRES_DB: whatsapp_load
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: whatsapp
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp -d whatsapp_load"]
      interval: 2s
      timeout: 3s
      retries: 30

  load-valkey:
    image: valkey/valkey:8-alpine
    container_name: whatsapp-load-valkey
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "56379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
