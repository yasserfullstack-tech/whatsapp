global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: whatsapp-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:4000"]
        labels:
          service: api

  - job_name: whatsapp-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9464
        refresh_interval: 15s
    relabel_configs:
      - target_label: service
        replacement: worker

  - job_name: whatsapp-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://api:4000/ready"]
        labels:
          service: api
      - targets: ["http://worker:9464/ready"]
        labels:
          service: worker
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: public-https
    metrics_path: /probe
    params:
      module: [https_2xx]
    file_sd_configs:
      - files: ["/runtime/monitoring/public-targets.yml"]
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  - job_name: valkey-exporter
    static_configs:
      - targets: ["valkey-exporter:9121"]
        labels:
          service: valkey

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: host

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          service: alertmanager
