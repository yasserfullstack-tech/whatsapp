global:
  resolve_timeout: 5m

route:
  receiver: ops-webhook
  group_by: ["alertname", "severity", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: ops-webhook
      matchers:
        - severity="critical"
      group_wait: 10s
      repeat_interval: 30m

receivers:
  - name: ops-webhook
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true
        max_alerts: 0

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "service"]
