global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: whatsapp-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4000"]
        labels:
          service: api

  - job_name: whatsapp-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9464"]
        labels:
          service: worker
